<form class="search-bar" (ngSubmit)="onSubmit()">
  <input
    type="text"
    id="search"
    name="search"
    [placeholder]="this.placeholder() ? this.placeholder() : 'search...'"
    [(ngModel)]="searchParam"
  />
  <button
    class="btn btn-primary"
    [disabled]="!searchParam().length"
    type="submit"
  >
    Search
  </button>
</form>
<small class="search-hint text-muted">
  Ricerca avanzata: <code>parola</code> ricerca libera,
  <code>="frase esatta"</code> corrispondenza esatta,
  <code>'parola</code> deve contenere il termine,
  <code>!parola</code> esclude un termine,
  <code>^inizio</code> / <code>fine$</code> cercano un prefisso o un
  suffisso. Più termini separati da uno spazio devono essere tutti presenti;
  separati da <code>|</code> basta che ce ne sia uno.
</small>
