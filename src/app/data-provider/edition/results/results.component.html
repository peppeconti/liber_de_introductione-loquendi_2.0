<app-header [data]="this.data" />
<main>
  <div class="search-bar">
    <app-search placeholder="make a new search..." />
  </div>
  <div class="results">
    @if (this.results()?.length) {
      @for (result of this.results(); track result.id) {
        @for (snippet of result.snippets; track $index) {
          <app-result [id]="result.id" [text]="snippet" />
        }
      }
    } @else {
      <p>La ricerca non ha dato risultati.</p>
    }
  </div>
</main>
